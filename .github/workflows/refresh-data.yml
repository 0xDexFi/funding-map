name: Refresh data from USAspending.gov

# Pulls fresh numbers from the free USAspending.gov API once a month (and on demand
# from the Actions tab), rebuilds the site, and commits the result. Cloudflare Pages
# then redeploys automatically.
on:
  schedule:
    - cron: '17 9 5 * *'   # 09:17 UTC on the 5th of every month
  workflow_dispatch:
    inputs:
      fy:
        description: 'Fiscal year to show (blank keeps the default)'
        required: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch data
        env:
          FY: ${{ inputs.fy || '2025' }}
        run: python pipeline/fetch_data.py site_data
      - name: Build site
        env:
          CONTACT: ${{ vars.CONTACT }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python pipeline/build_site.py site_data site
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh data from USAspending.gov"
          git push
